# Genera un APK instalable de ChancayGo en los servidores gratuitos de GitHub (sin cuenta de Expo).
# Uso: pestaña "Actions" > "Build Android APK" > "Run workflow". Al terminar, descarga el APK en "Artifacts".
name: Build Android APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SHARE_BASE_URL: ${{ secrets.SHARE_BASE_URL }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Instalar dependencias
        run: npm install --legacy-peer-deps
      - name: Colocar la clave de Google Maps
        run: |
          KEY="${GOOGLE_MAPS_API_KEY:-SIN_CLAVE}"
          jq --arg k "$KEY" '.expo.android.config.googleMaps.apiKey=$k | .expo.ios.config.googleMapsApiKey=$k' app.json > app.tmp && mv app.tmp app.json
      - name: Generar proyecto Android
        run: npx expo prebuild --platform android --no-install
      - name: Probar empaquetado (si falla, el error real queda en las ultimas lineas)
        run: |
          set -o pipefail
          npx expo export --platform android --output-dir dist-check 2>&1 | grep -v '▓' | tail -80
      - name: Compilar APK
        run: cd android && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ChancayGo-apk
          path: android/app/build/outputs/apk/release/app-release.apk
